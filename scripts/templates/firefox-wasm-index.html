<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trojans VM — Firefox</title>
    <link rel="icon" href="/logo.png" />
    <link rel="stylesheet" href="./trojans-vm.css" />
    <script type="module" src="./assets/index-placeholder.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #070b12;
      }
      #app {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Redirect back to the hub if the user exits via the VM splash
      window.addEventListener("message", (e) => {
        if (e?.data?.type === "trojans-vm-exit") {
          window.location.assign("/");
        }
      });
    </script>
  </body>
</html>
