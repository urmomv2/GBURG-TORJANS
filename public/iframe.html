<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading…</title>
  <style>
    html, body, iframe {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <iframe
    id="frame"
    allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture; gamepad"
  ></iframe>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      let target = params.get('url') || '';

      // Resolve PeteZah "!!/" shortcut to the embed transport
      if (target.startsWith('/!!/')) {
        target = '/embed.html#' + target.slice(4);
      }
      // Bare URLs (no protocol, not absolute) become local paths
      else if (!/^(https?:)?\/\//.test(target) && !target.startsWith('/')) {
        target = '/' + target;
      }

      document.getElementById('frame').src = target || 'about:blank';
      document.title = 'Trojans — ' + (target || 'Game');
    })();
  </script>
</body>
</html>
